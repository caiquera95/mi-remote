<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><title>Mi Remote</title><style>*{box-sizing:border-box}body{margin:0;background:#101114;color:#f5f5f7;font:16px -apple-system,BlinkMacSystemFont,sans-serif;min-height:100dvh}main{max-width:430px;margin:auto;padding:calc(env(safe-area-inset-top) + 26px) 24px calc(env(safe-area-inset-bottom) + 26px)}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:23px;letter-spacing:-.7px;margin:0}.status{font-size:12px;color:#a0a0a8;margin-top:7px}.pill{border:1px solid #393b40;background:#202126;color:#eee;border-radius:30px;padding:10px 14px;font-size:12px}.screen{text-align:center;margin:44px 0 32px}.screen .device{font-size:16px;font-weight:600}.screen .subtitle{font-size:12px;color:#898991;margin-top:7px}.pad{width:min(77vw,310px);height:min(77vw,310px);margin:0 auto;position:relative;border-radius:50%;background:linear-gradient(145deg,#34363d,#222329);box-shadow:0 12px 32px #0007,inset 0 1px 1px #ffffff24}.pad button{position:absolute;border:0;background:transparent;color:#d4d4da;font-size:28px;touch-action:manipulation}.pad button:active,.controls button:active{background:#50525b}.up{top:0;left:28%;width:44%;height:28%;border-radius:70px 70px 18px 18px}.down{bottom:0;left:28%;width:44%;height:28%;border-radius:18px 18px 70px 70px}.left{left:0;top:28%;height:44%;width:28%;border-radius:70px 18px 18px 70px}.right{right:0;top:28%;height:44%;width:28%;border-radius:18px 70px 70px 18px}.pad .ok{top:30%;left:30%;width:40%;height:40%;border-radius:50%;background:#15161a;font-size:16px;font-weight:650;box-shadow:0 2px 8px #0006}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:35px}.controls button{height:65px;border:1px solid #32343a;background:#222329;color:#fff;border-radius:22px;font-size:21px}.controls button small{display:block;font-size:11px;color:#aaa;margin-top:3px}.setup{margin-top:32px;padding:18px;background:#1c1d22;border-radius:20px}.setup label{font-size:12px;color:#b5b5bd;display:block;margin-bottom:9px}.setup input{width:100%;border:1px solid #41424a;border-radius:12px;background:#111216;color:white;padding:13px;font-size:16px}.setup p{font-size:12px;line-height:1.5;color:#9898a1;margin:10px 0 0}.note{font-size:12px;color:#a9a9b1;text-align:center;margin-top:16px}</style></head><body><main><header><div><h1>Mi Remote</h1><div class="status" id="status">● Receptor não conectado</div></div><button class="pill" id="test">Testar conexão</button></header><section class="screen"><div class="device">Mi TV Stick</div><div class="subtitle">Controle remoto por Wi-Fi</div></section><div class="pad"><button class="up" data-key="UP" aria-label="Cima">⌃</button><button class="left" data-key="LEFT" aria-label="Esquerda">‹</button><button class="ok" data-key="OK">OK</button><button class="right" data-key="RIGHT" aria-label="Direita">›</button><button class="down" data-key="DOWN" aria-label="Baixo">⌄</button></div><div class="controls"><button data-key="BACK">↩<small>Voltar</small></button><button data-key="HOME">⌂<small>Início</small></button><button data-key="PLAY_PAUSE">⏯<small>Reproduzir</small></button><button data-key="VOLUME_DOWN">−<small>Volume</small></button><button data-key="MUTE">◖<small>Mudo</small></button><button data-key="VOLUME_UP">+<small>Volume</small></button></div><section class="setup"><label for="endpoint">Endereço do receptor na TV</label><input id="endpoint" type="url" placeholder="http://192.168.1.3:8765" autocomplete="off" spellcheck="false"><p>É necessário instalar o receptor Android na TV para que os botões funcionem. A interface sozinha não controla a TV.</p></section><div class="note" id="feedback">Pronto para configurar</div></main><script>const input=document.querySelector('#endpoint'),status=document.querySelector('#status'),feedback=document.querySelector('#feedback');input.value=localStorage.getItem('endpoint')||'http://192.168.1.3:8765';input.addEventListener('change',()=>localStorage.setItem('endpoint',input.value));async function request(path,body){let url=input.value.replace(/\/$/,'');if(!/^https?:\/\//.test(url))throw Error('Endereço inválido');const r=await fetch(url+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(2500)});if(!r.ok)throw Error('Resposta HTTP '+r.status);return r}async function send(key){feedback.textContent='Enviando '+key+'…';try{await request('/api/key',{key});feedback.textContent='Comando enviado: '+key}catch(e){feedback.textContent='Sem conexão com o receptor: '+e.message}}document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>send(b.dataset.key)));document.querySelector('#test').addEventListener('click',async()=>{try{await request('/health');status.textContent='● Receptor conectado';status.style.color='#78d69a';feedback.textContent='Conexão estabelecida'}catch(e){status.textContent='● Receptor não conectado';status.style.color='#f5b0a9';feedback.textContent='Não foi possível conectar: '+e.message}});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
